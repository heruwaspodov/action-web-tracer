<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ActionWebTracer</title>
		<link rel="stylesheet" href="./sidepanel.css" />
	</head>
	<body>
		<main aria-labelledby="panel-title">
			<h1>ActionWebTracer</h1>
			<p id="panel-title">Trace what happens after an action in this tab.</p>
			<p id="recording-badge" aria-live="polite"></p>
			<section aria-labelledby="status-title">
				<h2 id="status-title">Recording status</h2>
				<p id="recording-status" role="status"></p>
				<p id="recording-detail"></p>
			</section>
			<details class="privacy">
				<summary>Permission and privacy</summary>
				<p>Tracing uses Chrome debugger access only for this tab. Captured evidence stays on this device; request bodies, response bodies, cookies, form values, and WebSocket payloads are not captured.</p>
			</details>
			<div aria-label="Recording controls">
				<button id="start-recording" type="button">Trace This Tab</button>
				<button id="stop-recording" type="button">Stop</button>
			</div>
		</main>
		<script type="module" src="./sidepanel.js"></script>
	</body>
</html>
